<!DOCTYPE html>
<html lang="pt">
    <head>

        <title>Notícias do Quiz</title>

        <style>

            *{
                    margin:0;
                        padding:0;
                            box-sizing:border-box;
                                font-family:Arial,sans-serif;
            }

            body{
                    background:#f2f2f2;
            }

            header{
                    background: #191539;
                        color:white;
                            padding:15px;
                                display:flex;
                                    justify-content:space-between;
                                        align-items:center;
            }

            .logo{
                    font-size:28px;
                        font-weight:bold;
                        display: flex;
            }

            .logo img {
                  height:65px;
                  width: auto;
                  display: block;
            }

            

            #menu{
                    display:flex;
                    overflow-x: auto;
                        gap:20px;
            }

            #menu a{
                    color:white;
                        text-decoration:none;
            }

            .hero{
                    width:100%;
                        height:420px;
                            overflow:hidden;
            }

            .hero img{
                    width:100%;
                        height:100%;
                            object-fit:cover;
            }

            .section-title{
                    margin:20px;
                        font-size:28px;
                            color: #191539;
            }

            .news-grid{
                    display:grid;
                        grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
                            gap:20px;
                                padding:20px;
            }

            .card{
                    background:white;
                    color:#191539;
                        border-radius:10px;
                            overflow:hidden;
                                cursor:pointer;
                                    transition:0.3s;
            }

            .card:hover{
                    transform:translateY(-5px);
            }

            .card img{
                    width:100%;
                        height:200px;
                            object-fit:cover;
            }

            .card h3{
                    padding:15px;
            }

            #articlePage{
                    display:none;
                        padding:20px;
                            max-width:1000px;
                                margin:auto;
            }

            #articlePage img{
                    width:100%;
                        border-radius:10px;
            }

            #articlePage h1{
                    margin:20px 0;
            }

            .back{
                    background:#191539;
                        color:white;
                            border:none;
                                padding:10px 20px;
                                    margin-bottom:20px;
                                        cursor:pointer;
            }

            footer{
                    background:#191539;
                        color:white;
                            text-align:center;
                                padding:20px;
                                    margin-top:30px;
            }

            .slide{
            position:absolute;
            width: auto;
            height: 350px;
            background-size: cover;
            background-position:center;
            opacity:0;
            transition:1s;
            }

            .slide.active{
            opacity:1;
            }


        </style>

    </head>

            const grid = document.getElementById("newsGrid");

            noticias.forEach(noticia=>{

                grid.innerHTML += `

                <div class="card" onclick="abrirNoticia(${noticia.id})">

                    <img src="${noticia.imagem}">

                    <h3>${noticia.titulo}</h3>

                </div>

                `;

            });

            function abrirNoticia(id){

                const noticia = noticias.find(n=>n.id===id);

                document.getElementById("homePage").style.display="none";

                document.getElementById("articlePage").style.display="block";

                document.getElementById("title").textContent = noticia.titulo;

                document.getElementById("image").src = noticia.imagem;

                document.getElementById("content").innerHTML = noticia.conteudo;

                window.scrollTo(0,0);

            }

            function goHome(){

                document.getElementById("articlePage").style.display="none";

                document.getElementById("homePage").style.display="block";

                window.scrollTo(0,0);

            }

            const slides=document.querySelectorAll('.slide');
            let atual=0;

            setInterval(()=>{

            slides[atual].classList.remove('active');

            atual=(atual+1)%slides.length;

            slides[atual].classList.add('active');

            },3000);

        </script>
