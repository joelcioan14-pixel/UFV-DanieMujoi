let nivel = 1;

const f = document.getElementById("f");

const numero = document.getElementById("numero");
const total = document.getElementById("total");

const pontosTela = document.getElementById("pontos");
const nivelAtual = document.getElementById("nivelAtual");

const resultado = document.getElementById("resultado");

const alternativas = [a,b,c,d,e,f];

function atualizarTema(){

        if(nivel === 1){
                    document.body.style.background = "#8A2BE2";
        }

        if(nivel === 2){
                     document.body.style.background = "#2F4F4F";
        }

            if(nivel === 3){
                        document.body.style.background = "#4B0082";
            }

                if(nivel === 4){
                            document.body.style.background = "#483D8B";
                }

                if(nivel === 5){
                             document.body.style.background = "#1C1C1C";
                }

                    nivelAtual.textContent = nivel;
}

function carregarQuestao(){

        let q = questoes[perguntaAtual];

            numQuestao.textContent = q.numQuestao;
                pergunta.textContent = q.pergunta;

                    a.textContent = q.alternativas[0];
                        b.textContent = q.alternativas[1];
                            c.textContent = q.alternativas[2];
                                d.textContent = q.alternativas[3];
                                    e.textContent = q.alternativas[4];
                                        f.textContent = q.alternativas[5];

                                            numero.textContent = perguntaAtual + 1;
                                                total.textContent = questoes.length;

                                                    alternativas.forEach(item => {
                                                                item.style.background = "#ffffff22";
                                                                        item.style.pointerEvents = "auto";
                                                    });
}

function mudarNivel(){

        nivel++;

            if(nivel === 2){
                        questoes = nivel2;
            }

                else if(nivel === 3){
                            questoes = nivel3;
                }

                    else if(nivel === 4){
                                questoes = nivel4;
                    }

            
                    else if(nivel === 5){
                                questoes = nivel5;
                    }

                        perguntaAtual = 0;
                            pontos = 0;

                                pontosTela.textContent = pontos;

                                    atualizarTema();
                                        carregarQuestao();
}

function terminarQuiz(mensagem){

        document.querySelector(".questoes").innerHTML = `
                <h2>${mensagem}</h2>
                        <br>
                                <h3>Pontuação Final: ${pontos}</h3>
                                <a href="index.html">Voltar para a página inicial</a>
                                    `;
}

function verificarResposta(elemento){

        let q = questoes[perguntaAtual];
            let resposta = elemento.textContent;

                alternativas.forEach(item => {

                            item.style.pointerEvents = "none";

                                    if(item.textContent === q.correta){
                                                    item.style.background = "green";
                                    }

                });

                    if(resposta === q.correta){

                                pontos += 10;
                                        pontosTela.textContent = pontos;

                    }else{

                    }

                        }, 1500);
}
